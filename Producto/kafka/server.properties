broker.id=1
zookeeper.connect=zookeeper:2181

# Doble listener: PLAINTEXT para clientes dentro de la red Docker (kafka:9092),
# PLAINTEXT_HOST para servicios corriendo en el host (localhost:29092).
# Sin esto, un cliente del host hace bootstrap por localhost:9092 pero el broker
# le anuncia kafka:9092, que no resuelve fuera de Docker, y la conexión muere.
listeners=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
advertised.listeners=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
inter.broker.listener.name=PLAINTEXT

offsets.topic.replication.factor=1
