# Perfil LOCAL: servicios corriendo fuera de Docker (en el host).
# Sobrescribe las URIs de routes en application.yml para apuntar a localhost
# con los puertos locales de cada servicio (routes-service:8000, history-service:8003).

# Issuer de Supabase fijado para dev local (Maven spring-boot:run no lee Producto/.env).
# El issuer-uri y el anon key son PUBLICOS (mismos valores ya commiteados en routes-ui
# y tag-ok-app), no son secretos. El service_role NO va aqui.
supabase:
  jwt:
    issuer-uri: https://ibafvqmoqeabmziyzifk.supabase.co/auth/v1

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://ibafvqmoqeabmziyzifk.supabase.co/auth/v1
  cloud:
    gateway:
      server:
        webflux:
          # OJO: esta lista REEMPLAZA por completo la de application.yml (no se fusiona),
          # por eso aqui van TODAS las rutas, incluidas las de Supabase.
          routes:
            - id: routes-service
              uri: http://localhost:8000
              predicates:
                - Path=/api/routes/**
              filters:
                - StripPrefix=2

            - id: history-service
              uri: http://localhost:8003
              predicates:
                - Path=/api/history/**
              filters:
                - StripPrefix=2

            - id: supabase-vehiculos
              uri: https://ibafvqmoqeabmziyzifk.supabase.co
              predicates:
                - Path=/api/vehiculos/**
              filters:
                - StripPrefix=2
                - PrefixPath=/rest/v1
                - AddRequestHeader=apikey, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImliYWZ2cW1vcWVhYm16aXl6aWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODc5NTIsImV4cCI6MjA5MjM2Mzk1Mn0.ZYYd0xW69sq1CyT6DqsMj23zFSfedrGaed35AhE-GEs

