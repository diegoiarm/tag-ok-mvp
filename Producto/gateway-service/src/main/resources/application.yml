spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: routes-service
              uri: http://routes-service:8080
              predicates:
                - Path=/api/routes/**

            - id: history-service
              uri: http://history-service:8080
              predicates:
                - Path=/api/history/**

server:
  port: 8080