spring.application.name=history-service

spring.kafka.consumer.group-id=history-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
logging.level.org.apache.kafka=ERROR

# Comparación de facturas con IA (Gemini, tier gratuito)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.timeout-segundos=60

# Límite de tamaño para la factura adjunta (PDF o foto)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB