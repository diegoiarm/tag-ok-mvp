spring.application.name=history-service

server.port=8080

spring.data.mongodb.host=db-historial
spring.data.mongodb.port=5678
spring.data.mongodb.database=historial_db
spring.data.mongodb.uri=mongodb://admin:admin@db-historial:5678/historial_db?authSource=admin

# Consumer
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=history-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000