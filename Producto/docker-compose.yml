services:

  # =========================
  # PostgreSQL (Rutas)
  # =========================

  db-rutas:
    image: pgrouting/pgrouting:15-3.3-3.4.1
    container_name: db-rutas
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_rutas
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    depends_on:
      - db-rutas
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "1000:80"
    volumes:
      - pgadmin_data:/var/lib/postgresql/data

  # =========================
  # MongoDB (Historial)
  # =========================

  db-historial:
    image: mongo:7
    container_name: db-historial
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "5678:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    depends_on:
      - db-historial
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_SERVER: db-historial
    ports:
      - "8002:8081"

  # =========================
  # Kafka
  # =========================

  zookeeper-tag:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-tag
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka-tag:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-tag
    depends_on:
      - zookeeper-tag
    ports:
      - "9092:9092"
      # Listener para clientes corriendo en el host (perfiles `local`)
      - "29092:29092"
    volumes:
      - ./kafka/server.properties:/etc/kafka/server.properties
    command: >
      bash -c "
        kafka-server-start /etc/kafka/server.properties
      "

  kafka-setup-tag:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka-tag
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh
    command: bash /init-topics.sh

  # =========================
  # Servicios
  # =========================

  routes-service:
    build: 
      context: ./routes-service
    container_name: routes-service
    depends_on:
      - db-rutas
      - kafka-setup-tag
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  history-service:
    build: 
      context: ./history-service
    container_name: history-service
    depends_on:
      - db-historial
      - kafka-setup-tag
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MONGODB_URI: ${MONGODB_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  gateway-service:
    build: 
      context: ./gateway-service
    container_name: gateway-service
    depends_on:
      - routes-service
      - history-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SUPABASE_JWT_ISSUER_URI: ${SUPABASE_JWT_ISSUER_URI}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY} 

  frontend-tag:
      build: ./routes-ui
      container_name: frontend-tag
      ports:
        - "80:80"
      depends_on:
        - gateway-service
      networks:
        - default

networks:
  default:
    name: tag-ok

volumes:
  postgres_data:
  pgadmin_data:
  mongo_data: